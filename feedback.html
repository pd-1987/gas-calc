<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
  <title>Feedback</title>
  <style>
.feedback-form .input-group {
  display: block;
  margin-bottom: 12px;
}

.feedback-form label {
  display: block;
  margin-bottom: 4px;
  font-weight: 600;
  font-size: 13px;
  color: var(--text-secondary);
}
.feedback-form input,
.feedback-form textarea {
  width: 100%;
  padding: 8px;
  font-size: 14px;
  box-sizing: border-box;   /* ← FIX */
}
.feedback-form textarea {
  resize: vertical;
  min-height: 90px;   /* was 100px */
}
    .submit-btn {
  margin-top: 8px;
  width: 100%;
  background-color: var(--clr-primary);
  border: 1px solid var(--clr-primary);
  color: white;
  font-weight: 600;
}

.submit-btn:hover {
  filter: brightness(0.95);
}
</style>
</head>
<body>
<header class="calc-header general">Feedback</header>

<div class="calc-wrapper">

  <div class="calc-section">
    <p>
      If you have any feedback, questions or come across any calculation errors please get in touch.
    </p>
  </div>

  <div class="calc-section">
<div class="instruction-header">Send feedback</div>
    <form class="feedback-form" action="https://formspree.io/f/mwplalwp" method="POST">

      <div class="input-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="_replyto" required>
      </div>

      <div class="input-group">
        <label for="message">Feedback</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>

      <button type="submit" class="submit-btn">Submit feedback</button>

    </form>

  </div>

</div>

<div class="main-control-buttons">
  <button type="button" class="home-btn" onclick="location.href='index.html'">Home</button>
</div>

<footer>
  <small>&copy; 2025 #OneTeam Anaesthesia. All rights reserved.</small>
</footer>

</body>
</html>
